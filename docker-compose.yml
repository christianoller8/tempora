services:
  postgres:
    image: postgres:17
    container_name: tempora-postgres
    environment:
      POSTGRES_DB: tempora
      POSTGRES_USER: tempora_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-devpassword}
    ports:
      - '5432:5432'
    volumes:
      - tempora-pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tempora_owner -d tempora']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tempora-pgdata:
